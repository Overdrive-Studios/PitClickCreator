# Builds the Pit Click desktop apps on real Mac and Windows machines.
# Push a tag like v1.0.1 and the .dmg and .exe files appear on the repo's Releases page.
# "Run workflow" on the Actions tab builds them too (downloadable from that run) without making a release.
name: Desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build the Mac app (.dmg)
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac

      - name: Build the Windows app (.exe)
        if: runner.os == 'Windows'
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: Pit-Click-${{ runner.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Pit Click ${{ github.ref_name }}
          files: out/*
          body: |
            **Mac:** download `Pit-Click-…-Mac.dmg`, open it and drag Pit Click into Applications.
            The first time, macOS will say it can't check the app. Click Done, then open System Settings → Privacy & Security, scroll down and click **Open Anyway** next to Pit Click. After that it opens normally. (Works on Apple Silicon and Intel Macs.)

            **Windows:** download `Pit-Click-…-Windows-Setup.exe` and run it. If Windows shows "Windows protected your PC", click **More info → Run anyway**.
            Or use the Portable `.exe`, which runs without installing.

            Your songs, maps and settings are saved inside the app on your computer. Everything works offline.
